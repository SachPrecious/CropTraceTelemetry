name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Build and Test
      working-directory: ./api
      run: |
        go mod tidy
        go build -v ./...
        # go test -v ./... (Add tests later)

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/croptrace-api

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./api
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy-to-local-kind:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1.8.0

    - name: Update image tag in deployment
      run: |
        # Replace the 'latest' tag with the branch tag if needed, or just let it pull latest
        sed -i 's|image: docker.io/sachithramanamperi/croptrace-api:latest|image: ${{ secrets.DOCKER_USERNAME }}/croptrace-api:main|g' k8s/05-api.yaml

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s/01-namespace.yaml
        kubectl apply -f k8s/02-configmap.yaml
        kubectl apply -f k8s/03-secret.yaml
        kubectl apply -f k8s/04-postgres.yaml
        kubectl apply -f k8s/05-api.yaml

    - name: Verify Deployment
      run: |
        kubectl get all -n croptrace
        kubectl rollout status deployment/croptrace-api -n croptrace --timeout=90s
