apiVersion: apps/v1
kind: Deployment
metadata:
  name: croptrace-api
  namespace: croptrace
  labels:
    app: croptrace-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: croptrace-api
  template:
    metadata:
      labels:
        app: croptrace-api
    spec:
      containers:
      - name: api
        # Image will be replaced during CI/CD
        image: docker.io/sachithramanamperi/croptrace-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: api-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: croptrace-api-service
  namespace: croptrace
spec:
  type: ClusterIP
  selector:
    app: croptrace-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: croptrace-api-hpa
  namespace: croptrace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: croptrace-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
